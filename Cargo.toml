[package]
name = "google-drive-linux"
version = "0.1.0"
edition = "2021"
authors = ["Google Drive Linux Contributors"]
description = "A FUSE-based Google Drive client and desktop manager for Linux"
license = "Apache-2.0"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Asynchronous runtime
tokio = { version = "1.43", features = ["full"] }

# GUI: GTK4 & Libadwaita
gtk4 = { version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }

# Configuration and Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "6.0"

# Networking and Authentication
reqwest = { version = "0.13", features = ["json", "form", "query"] }
url = "2.5"
sha2 = "0.10"
base64 = "0.22"
fastrand = "2.3"

# Logging and Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Filesystem in Userspace (FUSE3)
fuser = "0.18.0"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Local metadata + file cache
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.17"
